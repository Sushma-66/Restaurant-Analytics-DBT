name: hoshi_analytics
version: "1.0.0"
config-version: 2
require-dbt-version: [">=1.10.0", "<2.0.0"]

profile: hoshi_analytics

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs", "models"]

clean-targets: ["target", "dbt_packages", "logs"]

vars:
  # Landing zone the POS / CRM exports are dropped into (override in CI or prod)
  raw_data_path: "data/raw"
  # Orders older than this are considered final; incremental models reprocess this window
  incremental_lookback_days: 3
  vat_rate: 0.20
  # RFM is scored "as of" this date - pinned so results are reproducible against the synthetic data
  rfm_as_of_date: "2026-09-30"

models:
  hoshi_analytics:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]
    intermediate:
      +materialized: ephemeral
      +schema: intermediate
      +tags: ["intermediate"]
    marts:
      +materialized: table
      +tags: ["marts"]
      core:
        +schema: core
        +group: core
      finance:
        +schema: finance
        +group: finance
      marketing:
        +schema: marketing
        +group: marketing

seeds:
  hoshi_analytics:
    +schema: reference
    +tags: ["reference"]

snapshots:
  hoshi_analytics:
    +schema: snapshots

data_tests:
  hoshi_analytics:
    +store_failures: true
    +schema: test_failures
    +severity: error

flags:
  require_generic_test_arguments_property: true
