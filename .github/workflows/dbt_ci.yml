name: dbt CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}
  DBT_DUCKDB_PATH: ${{ github.workspace }}/hoshi_ci.duckdb

jobs:
  lint:
    name: Lint SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: dbt deps
      - name: sqlfluff
        run: sqlfluff lint models --format github-annotation-native

  build:
    name: dbt build (seed, snapshot, run, test)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Generate synthetic raw data
        run: python scripts/generate_raw_data.py --out data/raw --seed 42

      - name: dbt deps
        run: dbt deps

      - name: dbt parse (fail fast on YAML / Jinja errors)
        run: dbt parse --target ci

      - name: dbt build
        run: dbt build --target ci

      - name: Re-run incrementals (prove they are idempotent)
        run: dbt build --target ci --select config.materialized:incremental+

      - name: dbt docs generate
        run: dbt docs generate --target ci

      - name: Upload docs + run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: |
            target/manifest.json
            target/run_results.json
            target/catalog.json
            target/index.html
