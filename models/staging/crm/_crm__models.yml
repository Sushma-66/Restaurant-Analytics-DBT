version: 2

models:
  - name: stg_crm__members
    description: >
      Loyalty members. Marketing consent is normalised from Y / y / Yes / N / blank
      to a boolean, treating blank as *no consent* (GDPR-safe default).
    config:
      meta:
        contains_pii: true
    columns:
      - name: member_id
        description: "{{ doc('member_id') }}"
        data_tests: [unique, not_null]
      - name: email
        config:
          meta:
            pii: true
        data_tests: [not_null]
      - name: home_branch_code
        data_tests:
          - relationships:
              arguments:
                to: ref('branches')
                field: branch_code
      - name: has_marketing_consent
        data_tests: [not_null]

  - name: stg_crm__promotions
    description: Promotion definitions.
    columns:
      - name: promo_code
        data_tests: [unique, not_null]
      - name: discount_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
